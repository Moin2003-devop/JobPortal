<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Job</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .navbar{
            background:#2c3e50;
            color:white;
            padding:18px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:35px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
        }

        p{
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            margin-top:5px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            background:#3498db;
            color:white;
            font-size:17px;
            border-radius:6px;
            cursor:pointer;
            margin-top:15px;
        }

        button:hover{
            background:#2980b9;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            color:#3498db;
            font-weight:bold;
        }

        .job-box{
            background:#eef6ff;
            padding:15px;
            border-radius:8px;
            margin-bottom:25px;
        }

        .job-box h3{
            color:#2c3e50;
            margin-bottom:10px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>Job Portal</h2>

    <div>
        <a href="/jobs/">Jobs</a>
        <a href="/jobs/dashboard/">Dashboard</a>
    </div>

</div>

<div class="container">

    <h1>Apply Now</h1>

    <div class="job-box">

        <h3>{{ job.title }}</h3>

        <p><b>Company:</b> {{ job.company }}</p>

        <p><b>Location:</b> {{ job.location }}</p>

        <p><b>Salary:</b> {{ job.salary }}</p>

    </div>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Application
        </button>

    </form>

    <a href="/jobs/" class="back">
        ← Back to Jobs
    </a>

</div>

</body>
</html>
