<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;
}

.container{
width:550px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#2c3e50;
}

p{
margin-bottom:15px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

button{
width:100%;
padding:14px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#2980b9;
}

.login{
text-align:center;
margin-top:20px;
}

.login a{
text-decoration:none;
color:#3498db;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>User Registration</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">
Register
</button>

</form>

<div class="login">

Already have an account?

<br><br>

<a href="/login/">
Login Here
</a>

</div>

</div>

</body>
</html>
